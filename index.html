<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영원히 우리는 함께야</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M24 4 L41 10 V22 C41 33 34 41 24 45 C14 41 7 33 7 22 V10 Z' fill='%23EFE9FC' stroke='%236E56CF' stroke-width='2.5'/%3E%3Cpath d='M24 15 L27 22 L34.5 22.8 L29 27.8 L30.6 35 L24 31 L17.4 35 L19 27.8 L13.5 22.8 L21 22 Z' fill='%236E56CF'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root {
    --bg: #FFFBEA;
    --paper: #FFFFFF;
    --paper-border: #F0E2A8;
    --rail-bg: #FFF6D9;
    --ink: #4A3F1F;
    --ink-soft: #8A7A45;
    --ink-faint: #B8A96B;
    --accent: #B8860B;
    --accent-ink: #FFFFFF;
    --accent-soft: #FBF0C7;
    --positive: #2FAE83;
    --positive-soft: #E1F6EE;
    --negative: #E2634F;
    --negative-soft: #FBE7E2;
    --shadow: rgba(74, 63, 31, 0.10);
    --focus: #B8860B;
    --sky-soft: #DFEEFF;
    --gold-soft: #FFF3C4;
  }
  /* 항상 라이트 모드로 보이도록 다크 모드 자동 전환은 사용하지 않아요. */
  * { box-sizing: border-box; }
  html, body { background: var(--bg); margin: 0; color-scheme: light; }
  body {
    color: var(--ink);
    font-family: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .display { font-family: 'Jua', 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-weight: 400; text-wrap: balance; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  button, input, select { font-family: inherit; }
  a { color: var(--accent); }

  #app { min-height: 100vh; display: flex; flex-direction: column; }

  .topbar {
    display: flex; align-items: center; gap: 12px; padding: 14px 20px;
    background: var(--paper); border-bottom: 1px solid var(--paper-border);
    position: sticky; top: 0; z-index: 20;
  }
  .crest { flex: none; width: 38px; height: 38px; }
  .brand { display: flex; flex-direction: column; line-height: 1.15; }
  .brand-title { font-family: 'Jua', 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 20px; color: var(--accent); }
  .brand-sub { font-size: 12px; color: var(--ink-faint); }
  .topbar-right { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .topbar-icons { display: flex; align-items: center; gap: 6px; }
  .topbar-clock {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-faint); white-space: nowrap;
  }
  .iconbtn {
    flex: none; width: 36px; height: 36px; border-radius: 50%;
    border: 1.5px solid var(--paper-border); background: var(--paper); color: var(--accent);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .iconbtn svg { width: 18px; height: 18px; }
  .iconbtn:hover { background: var(--accent-soft); }

  .layout { flex: 1; display: flex; width: 100%; max-width: 1080px; margin: 0 auto; padding: 20px; gap: 20px; }
  .tabrail {
    flex: none; width: 176px; display: flex; flex-direction: column; gap: 6px;
    background: var(--rail-bg); border: 1px solid var(--paper-border); border-radius: 18px; padding: 12px;
    height: fit-content; position: sticky; top: 84px;
  }
  .tabbtn {
    display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 12px; border: none;
    background: transparent; color: var(--ink-soft); font-size: 15px; cursor: pointer; text-align: left;
    transition: background .15s ease, color .15s ease;
  }
  .tabbtn svg { flex: none; width: 20px; height: 20px; }
  .tabbtn:hover { background: var(--accent-soft); color: var(--ink); }
  .tabbtn.active { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .tabbtn .badge {
    margin-left: auto; background: var(--negative); color: #fff; border-radius: 999px; font-size: 11px;
    min-width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center;
    padding: 0 5px; font-family: 'JetBrains Mono', monospace;
  }
  .tabbtn.active .badge { background: rgba(255,255,255,.35); }

  .content { flex: 1; min-width: 0; }
  .panel {
    background: var(--paper); border: 1px solid var(--paper-border); border-radius: 20px; padding: 24px;
    box-shadow: 0 6px 20px var(--shadow);
  }
  .hidden { display: none !important; }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .panel-head h2 { margin: 0; font-size: 22px; color: var(--ink); }
  .panel-head p { margin: 4px 0 0; color: var(--ink-soft); font-size: 13.5px; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat-tile { background: var(--accent-soft); border-radius: 14px; padding: 14px 16px; }
  .stat-tile .num { font-family: 'Jua', 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 26px; color: var(--accent); display: block; }
  .stat-tile .label { font-size: 12.5px; color: var(--ink-soft); }
  .stat-tile.positive { background: var(--positive-soft); }
  .stat-tile.positive .num { color: var(--positive); }
  .stat-tile.negative { background: var(--negative-soft); }
  .stat-tile.negative .num { color: var(--negative); }

  .chip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .chip {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px;
    border: 1.5px dashed var(--negative); background: var(--negative-soft);
  }
  .chip.checked { border-style: solid; border-color: var(--positive); background: var(--positive-soft); }
  .chip .avatar {
    flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center; font-family: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 14px;
  }
  .chip .name { font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .tag { margin-left: auto; font-size: 11px; color: var(--negative); flex: none; }
  .chip.checked .tag { color: var(--positive); }

  .empty { text-align: center; padding: 40px 20px; color: var(--ink-soft); }
  .empty svg { width: 56px; height: 56px; color: var(--ink-faint); margin-bottom: 10px; }
  .empty .big { font-family: 'Jua', 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 17px; color: var(--ink); margin-bottom: 4px; }

  .rank-list { display: flex; flex-direction: column; gap: 10px; }
  .rank-row {
    display: grid; grid-template-columns: 34px 1fr auto auto; align-items: center; gap: 12px;
    padding: 12px 14px; border: 1px solid var(--paper-border); border-radius: 14px;
  }
  .rank-row .avatar {
    width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center; font-family: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 13px;
  }
  .rank-row .who .rname { font-weight: 600; }
  .rank-row .who .rmeta { font-size: 12px; color: var(--ink-faint); }
  .rank-row .wl { font-family: 'JetBrains Mono', monospace; font-size: 13px; text-align: right; }
  .rank-row .wl b.w { color: var(--positive); }
  .rank-row .wl b.l { color: var(--negative); }
  .stamp-row { display: flex; gap: 4px; justify-content: flex-end; }
  .stamp {
    width: 25px; height: 25px; border-radius: 50%; background: var(--paper);
    border: 2px solid var(--positive); color: var(--positive);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Jua', 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 11px; flex: none;
  }
  .stamp.loss { border-color: var(--negative); color: var(--negative); }
  .rank-row.hl-sky { background: var(--sky-soft); }
  .rank-row.hl-gold { background: var(--gold-soft); }
  .rank-legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 2px 0 0; }
  .rank-legend span { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-soft); }
  .rank-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .rank-legend i.sky { background: var(--sky-soft); }
  .rank-legend i.gold { background: var(--gold-soft); }

  .section { margin-bottom: 26px; }
  .section h3 { font-size: 16px; margin: 0 0 4px; color: var(--ink); }
  .section .hint { font-size: 12.5px; color: var(--ink-faint); margin: 0 0 12px; }
  .mini-list { margin: 0; padding: 0 0 0 18px; }
  .mini-list li { font-size: 12.5px; line-height: 1.65; color: var(--ink-soft); margin-bottom: 7px; }
  .mini-list li:last-child { margin-bottom: 0; }
  .mini-list li b { color: var(--ink); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input[type="text"], input[type="password"], input[type="number"], input[type="date"], select {
    background: var(--bg); border: 1.5px solid var(--paper-border); color: var(--ink); border-radius: 10px;
    padding: 9px 12px; font-size: 14px; outline: none;
  }
  input:focus, select:focus { border-color: var(--focus); }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: var(--accent-ink);
    border: none; border-radius: 10px; padding: 9px 16px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .btn svg { width: 14px; height: 14px; flex: none; }
  .btn:hover { filter: brightness(1.06); }
  .btn.ghost { background: transparent; color: var(--ink-soft); border: 1.5px solid var(--paper-border); }
  .btn.danger { background: var(--negative); }
  .btn.small { padding: 6px 11px; font-size: 12.5px; border-radius: 8px; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--paper-border); border-radius: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 480px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--paper-border); white-space: nowrap; }
  th { color: var(--ink-faint); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  tr:last-child td { border-bottom: none; }
  td input[type="number"] { width: 96px; }
  td input[type="text"] { width: 120px; }
  .warncell { display: flex; gap: 6px; flex-wrap: nowrap; }

  .toggle-chip {
    display: inline-flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 12px; cursor: pointer;
    user-select: none; border: 1.5px dashed var(--negative); background: var(--negative-soft);
  }
  .toggle-chip.on { border-style: solid; border-color: var(--positive); background: var(--positive-soft); }
  .toggle-chip .dotstate { width: 9px; height: 9px; border-radius: 50%; background: var(--negative); flex: none; }
  .toggle-chip.on .dotstate { background: var(--positive); }

  .lockbox { max-width: 340px; margin: 30px auto; text-align: center; }
  .lockbox svg { width: 44px; height: 44px; color: var(--accent); margin-bottom: 10px; }
  .lockbox .err { color: var(--negative); font-size: 13px; min-height: 18px; margin-top: 8px; }
  .lockbox form { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }

  #toastRoot { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast { background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 13.5px; box-shadow: 0 6px 18px var(--shadow); }
  #modalRoot { position: fixed; inset: 0; z-index: 200; pointer-events: none; }
  .modal-back { position: absolute; inset: 0; background: rgba(20, 16, 36, .45); display: flex; align-items: center; justify-content: center; padding: 20px; pointer-events: auto; }
  .modal-card { background: var(--paper); border-radius: 18px; padding: 22px; max-width: 320px; width: 100%; box-shadow: 0 12px 30px var(--shadow); }
  .modal-card p { color: var(--ink); font-size: 14.5px; margin: 0 0 16px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

  .notice-card { max-width: 380px; text-align: left; }
  .notice-title { margin: 0 0 10px; font-size: 18px; color: var(--accent); }
  .notice-title svg { width: 18px; height: 18px; vertical-align: -3px; margin-right: 2px; }
  .notice-card p { line-height: 1.65; }
  .notice-copyright { font-size: 12px; color: var(--ink-faint) !important; margin-top: -6px !important; }
  .notice-checkbox { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); margin: 16px 0 16px; cursor: pointer; user-select: none; }
  .notice-checkbox input { accent-color: var(--accent); width: 16px; height: 16px; }

  .minicheck { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--ink-soft); cursor: pointer; user-select: none; white-space: nowrap; }
  .minicheck input { accent-color: var(--accent); width: 14px; height: 14px; }
  .typecell { display: flex; flex-direction: column; gap: 4px; white-space: normal !important; }
  .tag-badge { display: inline-flex; align-items: center; font-size: 11px; padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-right: 4px; }

  .bottombar {
    display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: var(--paper); border-top: 1px solid var(--paper-border);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); justify-content: space-around;
  }
  .bottombar .tabbtn { flex-direction: column; gap: 3px; font-size: 10.5px; padding: 6px 4px; border-radius: 10px; flex: 1; align-items: center; position: relative; }
  .bottombar .tabbtn .badge { position: absolute; margin-left: 14px; margin-top: -14px; }

  .setupNotice { background: var(--negative-soft); color: var(--negative); border-radius: 12px; padding: 12px 16px; font-size: 13px; margin: 14px 20px 0; }

  .adminSubNav { display: flex; gap: 8px; flex-wrap: wrap; margin: 2px 0 22px; }
  .subtabbtn {
    border: 1.5px solid var(--paper-border); background: var(--paper); color: var(--ink-soft);
    border-radius: 999px; padding: 8px 14px; font-size: 13px; cursor: pointer;
  }
  .subtabbtn.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }

  .notice-list { display: flex; flex-direction: column; gap: 10px; max-height: 50vh; overflow-y: auto; }
  .notice-item { border: 1px solid var(--paper-border); border-radius: 12px; padding: 10px 12px; text-align: left; }
  .notice-item .nname { font-weight: 600; color: var(--ink); }
  .notice-item .nmeta { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .notice-item .nreason { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }

  .report-list { display: flex; flex-direction: column; gap: 8px; }
  .report-item { border: 1px solid var(--paper-border); border-radius: 12px; padding: 10px 14px; }
  .report-item summary { cursor: pointer; font-size: 14px; color: var(--ink); list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .report-item summary::-webkit-details-marker { display: none; }
  .report-item summary .cnt { color: var(--negative); font-weight: 600; font-family: 'JetBrains Mono', monospace; font-size: 13px; flex: none; }
  .report-item ul { margin: 10px 0 0; padding-left: 18px; }
  .report-item li { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 4px; }

  .guildinfo-card { border: 1px solid var(--paper-border); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .guildinfo-card:last-child { margin-bottom: 0; }
  .guildinfo-card .gname { font-weight: 600; color: var(--ink); margin-bottom: 4px; }
  .guildinfo-card .gnote { font-size: 13px; color: var(--ink-soft); white-space: pre-wrap; }
  .guildinfo-noterow {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 6px 0; border-top: 1px solid var(--paper-border);
  }
  .guildinfo-noterow:first-of-type { border-top: none; padding-top: 2px; }
  .guildinfo-noterow .gnote { flex: 1; }

  @media (max-width: 760px) {
    .tabrail { display: none; }
    .bottombar { display: flex; }
    .layout { padding: 14px; padding-bottom: 84px; }
    .panel { padding: 18px; border-radius: 16px; }
    .stats { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat-tile { padding: 10px 10px; }
    .stat-tile .num { font-size: 21px; }
    .brand-sub { display: none; }
    .brand-title { font-size: 15px; }
    .topbar { gap: 8px; padding: 12px 14px; }
    .rank-row { grid-template-columns: 28px 1fr auto auto; gap: 8px; }
    .stamp-row { gap: 2px; }
    .stamp { width: 18px; height: 18px; font-size: 8px; border-width: 1.5px; }
  }
</style>
</head>
<body>

<div id="app">
  <header class="topbar">
    <svg class="crest" viewBox="0 0 48 48" fill="none">
      <path d="M31 6 C22 6 15 13.5 15 23 C15 32.5 22 40 31 40 C24.5 37 20 30.5 20 23 C20 15.5 24.5 9 31 6 Z" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    </svg>
    <div class="brand">
      <span class="brand-title">영원히 우리는 함께야</span>
      <span class="brand-sub">우리 길드 랭크 · 경고 기록장</span>
    </div>
    <div class="topbar-right">
      <div class="topbar-icons">
        <button class="iconbtn" id="megaphoneBtn" type="button" title="활동 불가 안내" aria-label="활동 불가 안내">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a2 2 0 0 0 2 2h1l1 4h2l-1-4h1l10 4V5L9 9H6a2 2 0 0 0-2 2z"/><path d="M19 9.5a3 3 0 0 1 0 5"/></svg>
        </button>
        <button class="iconbtn" id="waitlistBtn" type="button" title="대기자 명단" aria-label="대기자 명단">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6"/><circle cx="12" cy="16.3" r="0.9" fill="currentColor" stroke="none"/></svg>
        </button>
      </div>
      <span class="topbar-clock mono" id="topbarClock">-</span>
    </div>
  </header>

  <div class="layout">
    <nav class="tabrail" id="tabrail"></nav>
    <main class="content">
      <section class="panel" id="panelRoot"><div class="empty">불러오는 중...</div></section>
    </main>
  </div>

  <nav class="bottombar" id="bottombar"></nav>
</div>
<div id="toastRoot"></div>
<div id="modalRoot"></div>

<script type="module">
  /* =========================================================================
     길드노트 - Firebase 설정
     아래 firebaseConfig 자리에 Firebase 콘솔에서 복사한 값을 붙여넣으세요.
     (같이 드린 "배포 가이드" 문서의 3단계를 참고하세요)
     ========================================================================= */
  const firebaseConfig = {
    apiKey: "여기에_apiKey_붙여넣기",
    authDomain: "여기에_authDomain_붙여넣기",
    projectId: "여기에_projectId_붙여넣기",
    storageBucket: "여기에_storageBucket_붙여넣기",
    messagingSenderId: "여기에_messagingSenderId_붙여넣기",
    appId: "여기에_appId_붙여넣기"
  };
  /* ========================================================================= */

  /* Firebase SDK is loaded dynamically inside connectFirebase() below, wrapped
     in try/catch, so a network hiccup or bad config shows a clear on-page
     error instead of silently freezing the whole app. */
  var getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc,
    collection, query, orderBy, limit, onSnapshot;
  var db = null, dbReady = false, dbError = null;

  /* ---------------- icons ---------------- */
  var ICONS = {
    rank: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 5H5a1 1 0 0 0-1 1c0 2.2 1.6 4 3.6 4.3"/><path d="M16 5h3a1 1 0 0 1 1 1c0 2.2-1.6 4-3.6 4.3"/><path d="M12 13v3"/><path d="M9 20h6"/><path d="M9.5 20c0-1.7.9-2.6 2.5-2.6s2.5.9 2.5 2.6"/></svg>',

  /* ---------------- helpers ---------------- */
  function toDateKey(d) {
    var y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function initials(name) { var s = (name || "").trim(); return s ? s.slice(0, 1) : "?"; }
  function fmtDateLong(dateKey) {
    var d = new Date(dateKey + "T00:00:00");
    if (isNaN(d)) return dateKey;
    return new Intl.DateTimeFormat("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "short" }).format(d);
  }
  function fmtDateShort(dateKey) {
    var d = new Date(dateKey + "T00:00:00");
    if (isNaN(d)) return dateKey;
    return new Intl.DateTimeFormat("ko-KR", { month: "2-digit", day: "2-digit" }).format(d);
  }
  function fmtTimeShort(iso) {
    var d = new Date(iso);
    if (!iso || isNaN(d)) return "";
    var h = String(d.getHours()).padStart(2, "0");
    var mi = String(d.getMinutes()).padStart(2, "0");
    return h + "시 " + mi + "분";
  }

    var mi = String(d.getMinutes()).padStart(2, "0");

    el.textContent = mm + "." + dd + " " + hh + ":" + mi + ":" + ss;

  function confirmDialog(message, okLabel) {

      root.querySelector('[data-act="no"]').onclick = function () { root.innerHTML = ""; resolve(false); };
      root.querySelector('[data-act="yes"]').onclick = function () { root.innerHTML = ""; resolve(true); };
      root.querySelector(".modal-back").addEventListener("click", function (e) {
        if (e.target.classList.contains("modal-back")) { root.innerHTML = ""; resolve(false); }
      });
    });
  }
  function memberById(id) { for (var i = 0; i < members.length; i++) if (members[i].id === id) return members[i]; return null; }
  function weekStartKey(d) {
    var day = d.getDay();
    var diff = day === 0 ? -6 : 1 - day;
    var monday = new Date(d.getFullYear(), d.getMonth(), d.getDate() + diff);
    return toDateKey(monday);
  }
  function guildRankWeeklyCount(memberId) {
    var wk = weekStartKey(new Date());
    var n = 0;
    for (var i = 0; i < rankRecords.length; i++) {
      if (rankRecords[i].memberId === memberId && rankRecords[i].date >= wk) n++;

  }
  function weekOfMonthLabel(d) {
    var year = d.getFullYear(), mon = d.getMonth();
    var firstDow = new Date(year, mon, 1).getDay();
    var firstMonday = new Date(year, mon, 1 - ((firstDow + 6) % 7));
    var diffDays = Math.round((new Date(year, mon, d.getDate()) - firstMonday) / 86400000);
    var week = Math.floor(diffDays / 7) + 1;
    return (mon + 1) + "월 " + week + "주차";
  }

  /* ---------------- boot ---------------- */
  // Nav and an initial render happen immediately and unconditionally, so the
  // tabs are always clickable even if Firebase never manages to connect.
  function boot() {
    updateTopbarClock();
    setInterval(updateTopbarClock, 1000);
    window.addEventListener("error", function (e) {
      reportFatal(e && e.message ? e.message : "알 수 없는 오류");
    });
    window.addEventListener("unhandledrejection", function (e) {
      reportFatal(e && e.reason && e.reason.message ? e.reason.message : String(e.reason || "알 수 없는 오류"));
    });
    var megaphoneBtn = document.getElementById("megaphoneBtn");
    if (megaphoneBtn) megaphoneBtn.onclick = showInactivityModal;
    var waitlistBtn = document.getElementById("waitlistBtn");
    if (waitlistBtn) waitlistBtn.onclick = showWaitlistModal;
    buildNav();
    render();
    connectFirebase();
    if (shouldShowNotice()) showNoticeModal();

  function reportFatal(msg) {
    if (dbReady && db) return; // app is already working fine, ignore stray errors
    dbError = msg;
    dbReady = true;
    render();
  }

  async function connectFirebase() {
    if (!firebaseConfig.apiKey || firebaseConfig.apiKey.indexOf("여기에") !== -1) {
      dbError = "firebaseConfig 값이 아직 입력되지 않았어요. index.html 위쪽의 firebaseConfig 자리에 배포 가이드에서 안내한 값을 붙여넣어주세요.";
      dbReady = true;
      render();
      return;
    }
    try {
      var appMod = await import("https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js");
      var fsMod = await import("https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js");
      getFirestore = fsMod.getFirestore; doc = fsMod.doc; getDoc = fsMod.getDoc;
      setDoc = fsMod.setDoc; updateDoc = fsMod.updateDoc; deleteDoc = fsMod.deleteDoc;
      addDoc = fsMod.addDoc; collection = fsMod.collection; query = fsMod.query;
      orderBy = fsMod.orderBy; limit = fsMod.limit; onSnapshot = fsMod.onSnapshot;

      var app = appMod.initializeApp(firebaseConfig);
      db = getFirestore(app);
      dbReady = true;
      dbError = null;
      subscribeAll();
      render();
    } catch (e) {
      dbError = "Firebase 연결에 실패했어요: " + (e && e.message ? e.message : String(e));
      dbReady = true;
      db = null;
      render();
    }
  }

  function subscribeAll() {
    onSnapshot(doc(db, "config", "settings"), function (snap) {
      settings = snap.exists() ? (snap.data() || {}) : {};
      settingsLoaded = true;
      render();
    }, function (e) { reportFatal(e.message || String(e)); });

    onSnapshot(query(collection(db, "members"), orderBy("order", "asc")), function (qs) {
      members = qs.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      render();
    }, function (e) { reportFatal(e.message || String(e)); });

    onSnapshot(query(collection(db, "rankRecords"), orderBy("date", "desc"), limit(500)), function (qs) {
      rankRecords = qs.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      render();
    }, function (e) { reportFatal(e.message || String(e)); });

    onSnapshot(query(collection(db, "inactivityNotices"), orderBy("createdAt", "desc")), function (qs) {
      inactivityNotices = qs.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      render();
    }, function (e) { reportFatal(e.message || String(e)); });

    onSnapshot(query(collection(db, "otherGuilds"), orderBy("updatedAt", "desc")), function (qs) {
      otherGuilds = qs.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      render();
    }, function (e) { reportFatal(e.message || String(e)); });

    onSnapshot(query(collection(db, "waitlist"), orderBy("createdAt", "desc")), function (qs) {
      waitlist = qs.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      render();
    }, function (e) { reportFatal(e.message || String(e)); });
  }

  /* ---------------- nav ---------------- */
  function buildNav() {
    var warnCount = members.filter(function (m) { return !!m.lowActivity || !!m.lowReputation; }).length;
    var badges = { warning: warnCount };

    [document.getElementById("tabrail"), document.getElementById("bottombar")].forEach(function (rail) {
      rail.innerHTML = TAB_DEFS.map(function (t) {
        var badge = badges[t.id] ? '<span class="badge">' + badges[t.id] + "</span>" : "";
        return '<button class="tabbtn' + (currentTab === t.id ? " active" : "") + '" data-tab="' + t.id + '">' + t.icon + "<span>" + t.label + "</span>" + badge + "</button>";
      }).join("");
      Array.prototype.forEach.call(rail.querySelectorAll(".tabbtn"), function (btn) {
        btn.onclick = function () { currentTab = btn.getAttribute("data-tab"); render(); };
      });
    });
  }

  /* ---------------- render dispatch ---------------- */
  function render() {
    buildNav();
    var root = document.getElementById("panelRoot");
    if (!dbReady) {
      root.innerHTML = '<div class="empty">' + ICONS.empty + '<div class="big">불러오는 중...</div></div>';
      return;
    }
    if (dbError) {
      root.innerHTML =
        '<div class="empty">' + ICONS.empty +
        '<div class="big">데이터에 연결하지 못했어요</div>' +
        "<p>" + escapeHtml(dbError) + "</p>" +
        '<p style="margin-top:14px"><button class="btn" id="retryConnBtn">다시 연결하기</button></p></div>';
      var retryBtn = document.getElementById("retryConnBtn");
      if (retryBtn) retryBtn.onclick = function () { dbError = null; dbReady = false; render(); connectFirebase(); };
      return;
    }
    if (currentTab === "rank") root.innerHTML = renderRank();
    else if (currentTab === "warning") root.innerHTML = renderWarning();
    else if (currentTab === "rankcount") root.innerHTML = renderRankCount();
    else if (currentTab === "ops") root.innerHTML = renderOps();
    else root.innerHTML = renderAdmin();
    wireTabEvents();
  }

  /* ---------------- rank tab ---------------- */
  function renderRank() {
    var byMember = {};
    var weekStart = weekStartKey(new Date());
    rankRecords.forEach(function (r) {
      var key = r.memberId || r.memberName;
      if (!byMember[key]) byMember[key] = { key: key, name: r.memberName, wins: 0, losses: 0, last: r.date, recent: [], weekCount: 0 };
      if (r.date >= weekStart) byMember[key].weekCount++;
      if (r.result === "win") byMember[key].wins++; else byMember[key].losses++;
      if (!byMember[key].last || r.date > byMember[key].last) byMember[key].last = r.date;
      byMember[key].recent.push(r);
    });
    var list = Object.keys(byMember).map(function (k) { return byMember[k]; });
    list.forEach(function (p) { p.recent.sort(function (a, b) { return b.date < a.date ? -1 : 1; }); p.recent = p.recent.slice(0, 7); });
    list.sort(function (a, b) { return (b.wins - b.losses) - (a.wins - a.losses); });

    var totalWins = list.reduce(function (s, p) { return s + p.wins; }, 0);
    var totalLosses = list.reduce(function (s, p) { return s + p.losses; }, 0);
    var totalGames = totalWins + totalLosses;
    var winRate = totalGames ? Math.round((totalWins / totalGames) * 100) : 0;

    var body;
    if (list.length === 0) {
      body = emptyState("아직 랭크 기록이 없어요", "관리 탭에서 길드 랭크 결과를 입력하면 여기에 표시돼요.");
    } else {
      body = '<div class="rank-list">' + list.map(function (p) {
        var games = p.wins + p.losses;
        var rate = games ? Math.round((p.wins / games) * 100) : 0;
        var oldestFirst = p.recent.slice().reverse();
        var stamps = oldestFirst.map(function (r) {
          return '<span class="stamp' + (r.result === "loss" ? " loss" : "") + '">' + (r.result === "loss" ? "패" : "승") + "</span>";
        }).join("");
        var hlClass = p.weekCount >= 7 ? " hl-gold" : p.weekCount >= 5 ? " hl-sky" : "";
        return (
          '<div class="rank-row' + hlClass + '">' +
          '<span class="avatar">' + escapeHtml(initials(p.name)) + "</span>" +
          '<div class="who"><div class="rname">' + escapeHtml(p.name || "(이름없음)") + '</div><div class="rmeta">최근 참여 ' + fmtDateShort(p.last) + "</div></div>" +
          '<div class="stamp-row">' + stamps + "</div>" +
          '<div class="wl"><b class="w">' + p.wins + "승</b> <b class=\"l\">" + p.losses + "패</b><br><span style=\"color:var(--ink-faint)\">승률 " + rate + "%</span></div>" +
          "</div>"
        );
      }).join("") + "</div>";
    }

    var rankLastChecked = settings.rankLastUpdatedAt ? fmtTimeShort(settings.rankLastUpdatedAt) : "";

    return (
      '<div class="panel-head"><div><h2>길드 랭크</h2>' +
      "<p>" + fmtDateLong(toDateKey(new Date())) + " · " + weekOfMonthLabel(new Date()) + " (월~일 기준)" +
      (rankLastChecked ? " · 마지막 체크 시각 : " + rankLastChecked : "") + "</p>" +
      '<div class="rank-legend"><span><i class="sky"></i>이번 주 5회 이상 참여</span><span><i class="gold"></i>이번 주 7회 참여</span></div>' +
      "</div>" +
      '<button class="btn ghost small" id="rankDutyBtn" type="button">' + ICONS.crown + " 담당자</button>" +
      "</div>" +
      '<div class="stats">' +
      statTile(list.length, "참여 인원", "") +
      statTile(totalWins + "승 " + totalLosses + "패", "전체 전적", "") +
      statTile(winRate + "%", "전체 승률", "positive") +
      "</div>" + body
    );
  }

        '<li><b>⑤ 대기자 목록</b> — 길드 가입 대기자와 카드교환 대기자를 각각 이름 · 메모로 등록·관리해요. 등록하면 상단 느낌표 아이콘 목록에 바로 반영돼요.</li>' +
        '<li><b>⑥ 설정</b> — 길랭 경고 기준(주당 최소 참여 횟수를 입력·저장하면 그 기준으로 길랭 횟수 탭과 아래 참여 현황표에 반영돼요) · 관리자 비밀번호 변경.</li>' +
        "<li><b>⑦ 사용 가이드</b> — 지금 보고 있는 이 안내예요. 사이트를 떠나지 않고 언제든 다시 확인할 수 있어요.</li>" +
        "</ul>" +
        "</div>" +

        '<div class="section">' +
        "<h3>화면이 이상하게 보일 때</h3>" +
        '<p class="hint">예전 화면 그대로 보인다면 브라우저 캐시 문제일 가능성이 높아요. 강력 새로고침(Ctrl+Shift+R / Cmd+Shift+R)을 해보세요.</p>' +
        "</div>" +

        '<div class="section">' +
        "<h3>아이디어 제안 환영</h3>" +
        '<p class="hint">업데이트하면 좋을 것 같은 부분이나 추가되면 좋을 것 같은 기능이 있다면 언제든 편하게 말씀해주세요. 사소한 아이디어도 대환영이에요!</p>' +
        "</div>"
      );
    }

    return (
      '<div class="panel-head"><div><h2>관리</h2><p>길드원 · 랭크 · 경고 · 길드 정보를 관리해요.</p></div>' +
      '<button class="btn ghost small" id="logoutBtn">로그아웃</button></div>' +
      '<div class="adminSubNav">' + subNav + "</div>" +
      subContent
    );
  }

  /* ---------------- small render helpers ---------------- */
  function statTile(num, label, tone) {
    return '<div class="stat-tile' + (tone ? " " + tone : "") + '"><span class="num">' + num + "</span><span class=\"label\">" + label + "</span></div>";
  }
  function emptyState(big, small, icon) {
    return '<div class="empty">' + (icon || ICONS.empty) + '<div class="big">' + big + "</div><p>" + small + "</p></div>";
  }

  /* ---------------- event wiring per render ---------------- */
  function wireTabEvents() {
    var rankDutyBtn = document.getElementById("rankDutyBtn");
    if (rankDutyBtn) rankDutyBtn.onclick = showRankDutyModal;

    // Shared password-gate wiring: used by both the 관리 tab and the 운영 tab,
    // since they use the same admin password / isAdmin session flag.
    var setupForm = document.getElementById("setupForm");
    if (setupForm) {
      setupForm.onsubmit = async function (e) {
        e.preventDefault();
        var pw = document.getElementById("setupPw").value;
        var pw2 = document.getElementById("setupPw2").value;
        var err = document.getElementById("setupErr");
        if (pw.length < 4) { err.textContent = "비밀번호는 4자 이상으로 만들어주세요."; return; }
        if (pw !== pw2) { err.textContent = "비밀번호가 서로 달라요."; return; }
        await setDoc(doc(db, "config", "settings"), Object.assign({}, settings, { adminPassword: pw }));
        isAdmin = true;
        try { sessionStorage.setItem("gn_admin", "1"); } catch (ex) {}
        toast("관리자 비밀번호가 설정되었어요");
      };
    }

    var loginForm = document.getElementById("loginForm");
    if (loginForm) {
      loginForm.onsubmit = function (e) {
        e.preventDefault();
        var pw = document.getElementById("loginPw").value;
        var err = document.getElementById("loginErr");
        if (pw === settings.adminPassword) {
          isAdmin = true;
          try { sessionStorage.setItem("gn_admin", "1"); } catch (ex) {}
          render();
        } else {
          err.textContent = "비밀번호가 올바르지 않아요.";
        }
      };
    }

    var logoutBtn = document.getElementById("logoutBtn");
    if (logoutBtn) logoutBtn.onclick = function () {
      isAdmin = false;
      try { sessionStorage.removeItem("gn_admin"); } catch (ex) {}
      render();
    };

    if (currentTab !== "admin") return;

    Array.prototype.forEach.call(document.querySelectorAll('[data-role="adminsubtab"]'), function (btn) {
      btn.onclick = function () { adminSubTab = btn.getAttribute("data-subtab"); render(); };
    });

    var addMemberBtn = document.getElementById("addMemberBtn");
    if (addMemberBtn) addMemberBtn.onclick = async function () {
      var input = document.getElementById("newMemberName");
      var reputeChk = document.getElementById("newMemberRepute");
      var guildRankChk = document.getElementById("newMemberGuildRank");
      var managerChk = document.getElementById("newMemberManager");
      var name = input.value.trim();
      if (!name) return;
      var id = "m_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      await setDoc(doc(db, "members", id), {
        name: name, points: 0, order: Date.now(),
        repute: !!(reputeChk && reputeChk.checked),
        guildRank: !!(guildRankChk && guildRankChk.checked),
        manager: !!(managerChk && managerChk.checked),
        lowActivity: false,
        lowReputation: false
      });
      input.value = "";
      if (reputeChk) reputeChk.checked = false;
      if (guildRankChk) guildRankChk.checked = false;
      if (managerChk) managerChk.checked = false;
      toast(name + " 님을 추가했어요");
    };

    Array.prototype.forEach.call(document.querySelectorAll('[data-role="mname"]'), function (el) {
      el.onchange = async function () {
        await updateDoc(doc(db, "members", el.getAttribute("data-id")), { name: el.value.trim() || "(이름없음)" });
        toast("이름을 저장했어요");
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-role="mpoints"]'), function (el) {
      el.onchange = async function () {
        await updateDoc(doc(db, "members", el.getAttribute("data-id")), { points: Number(el.value) || 0 });
        toast("활동 포인트를 저장했어요");
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-role="mreputation"]'), function (el) {
      el.onchange = async function () {
        await updateDoc(doc(db, "members", el.getAttribute("data-id")), { reputation: Number(el.value) || 0 });
        toast("명성을 저장했어요");
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-role="mdelete"]'), function (el) {
      el.onclick = async function () {
        var m = memberById(el.getAttribute("data-id"));
        var ok = await confirmDialog((m ? m.name : "이 길드원") + " 님을 삭제할까요? 랭크 기록은 남아있어요.", "삭제");
        if (!ok) return;
        await deleteDoc(doc(db, "members", el.getAttribute("data-id")));
        toast("삭제했어요");
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-role="mrepute"]'), function (el) {
      el.onchange = async function () {
        await updateDoc(doc(db, "members", el.getAttribute("data-id")), { repute: el.checked });
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-role="mguildrank"]'), function (el) {
      el.onchange = async function () {
        await updateDoc(doc(db, "members", el.getAttribute("data-id")), { guildRank: el.checked });
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-role="mmanager"]'), function (el) {
      el.onchange = async function () {
        await updateDoc(doc(db, "members", el.getAttribute("data-id")), { manager: el.checked });
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-role="mlowtoggle"]'), function (el) {
      el.onclick = async function () {
        var m = memberById(el.getAttribute("data-id"));
        var next = !(m && m.lowActivity);
        await updateDoc(doc(db, "members", el.getAttribute("data-id")), { lowActivity: next });
        await updateDoc(doc(db, "config", "settings"), { warningLastUpdatedAt: new Date().toISOString() });
        toast(next ? "활동 포인트 경고 대상으로 지정했어요" : "활동 포인트 경고 대상에서 해제했어요");
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-role="mrepwarntoggle"]'), function (el) {
      el.onclick = async function () {
        var m = memberById(el.getAttribute("data-id"));
        var next = !(m && m.lowReputation);
        await updateDoc(doc(db, "members", el.getAttribute("data-id")), { lowReputation: next });
        await updateDoc(doc(db, "config", "settings"), { warningLastUpdatedAt: new Date().toISOString() });
        toast(next ? "명성 경고 대상으로 지정했어요" : "명성 경고 대상에서 해제했어요");
      };
    });

    var addReportBtn = document.getElementById("addReportBtn");
    if (addReportBtn) addReportBtn.onclick = async function () {
      var sel = document.getElementById("reportMemberSel");
      var reasonInput = document.getElementById("reportReasonInput");
      if (!sel.value) { toast("먼저 길드원을 등록해주세요"); return; }
      var reason = reasonInput.value.trim();
      if (!reason) { toast("신고 사유를 입력해주세요"); return; }
      var m = memberById(sel.value);
      var nextReports = ((m && m.reports) || []).concat([{ reason: reason, date: toDateKey(new Date()) }]);
      await updateDoc(doc(db, "members", sel.value), { reports: nextReports });
      await updateDoc(doc(db, "config", "settings"), { warningLastUpdatedAt: new Date().toISOString() });
      reasonInput.value = "";
      toast("신고를 등록했어요");
    };

    var reportEditToggleBtn = document.getElementById("reportEditToggleBtn");
    if (reportEditToggleBtn) reportEditToggleBtn.onclick = function () {
      var sel = document.getElementById("reportMemberSel");
      var id = sel ? sel.value : "";
      if (!id) { toast("먼저 길드원을 선택해주세요"); return; }
      reportEditMemberId = (reportEditMemberId === id) ? null : id;
      render();
    };
    Array.prototype.forEach.call(document.querySelectorAll('[data-role="reportdelete"]'), function (el) {
      el.onclick = async function () {
        var mid = el.getAttribute("data-id");
        var idx = Number(el.getAttribute("data-idx"));
        var m = memberById(mid);
        if (!m || !m.reports) return;
        var ok = await confirmDialog("이 신고 내역을 삭제할까요?", "삭제");
        if (!ok) return;
        var nextReports = m.reports.slice();
        nextReports.splice(idx, 1);
        await updateDoc(doc(db, "members", mid), { reports: nextReports });
        await updateDoc(doc(db, "config", "settings"), { warningLastUpdatedAt: new Date().toISOString() });
        toast("신고 내역을 삭제했어요");
      };
    });

    var addRankBtn = document.getElementById("addRankBtn");
    if (addRankBtn) addRankBtn.onclick = async function () {
      var memberSel = document.getElementById("rankMember");
      var dateInput = document.getElementById("rankDate");
      var resultSel = document.getElementById("rankResult");
      if (!memberSel.value) { toast("먼저 길드원을 등록해주세요"); return; }
      var m = memberById(memberSel.value);
      await addDoc(collection(db, "rankRecords"), {
        memberId: memberSel.value,
        memberName: m ? m.name : "(이름없음)",
        date: dateInput.value || toDateKey(new Date()),
        result: resultSel.value,
        createdAt: Date.now()
      });
      await updateDoc(doc(db, "config", "settings"), { rankLastUpdatedAt: new Date().toISOString() });
      toast("기록을 추가했어요");
    };
    Array.prototype.forEach.call(document.querySelectorAll('[data-role="rdelete"]'), function (el) {
      el.onclick = async function () {
        var ok = await confirmDialog("이 랭크 기록을 삭제할까요?", "삭제");
        if (!ok) return;
        await deleteDoc(doc(db, "rankRecords", el.getAttribute("data-id")));
        await updateDoc(doc(db, "config", "settings"), { rankLastUpdatedAt: new Date().toISOString() });
        toast("삭제했어요");
      };
    });

    var addInactiveBtn = document.getElementById("addInactiveBtn");
    if (addInactiveBtn) addInactiveBtn.onclick = async function () {
      var sel = document.getElementById("inactiveMemberSel");
      var periodInput = document.getElementById("inactivePeriodInput");
      var reasonInput = document.getElementById("inactiveReasonInput");
      if (!sel.value) { toast("먼저 길드원을 등록해주세요"); return; }
      var m = memberById(sel.value);
      await addDoc(collection(db, "inactivityNotices"), {
        memberId: sel.value,
        memberName: m ? m.name : "(이름없음)",
        period: periodInput.value.trim(),
        reason: reasonInput.value.trim(),
        createdAt: Date.now()
      });
      periodInput.value = ""; reasonInput.value = "";
      toast("활동 불가 안내를 등록했어요");
    };
    Array.prototype.forEach.call(document.querySelectorAll('[data-role="inactivedelete"]'), function (el) {
      el.onclick = async function () {
        var ok = await confirmDialog("이 활동 불가 안내를 삭제할까요?", "삭제");
        if (!ok) return;
        await deleteDoc(doc(db, "inactivityNotices", el.getAttribute("data-id")));
        toast("삭제했어요");
      };
    });

    var addGuildInfoBtn = document.getElementById("addGuildInfoBtn");
    if (addGuildInfoBtn) addGuildInfoBtn.onclick = async function () {
      var nameInput = document.getElementById("guildNameInput");
      var noteInput = document.getElementById("guildNoteInput");
      var name = nameInput.value.trim();
      if (!name) { toast("길드 이름을 입력해주세요"); return; }
      await addDoc(collection(db, "otherGuilds"), {
        guildName: name,
        note: noteInput.value.trim(),
        updatedAt: Date.now()
      });
      nameInput.value = ""; noteInput.value = "";
      toast("타 길드 정보를 등록했어요");
    };
    Array.prototype.forEach.call(document.querySelectorAll('[data-role="guildinfodelete"]'), function (el) {
      el.onclick = async function () {
        var ok = await confirmDialog("이 타 길드 정보를 삭제할까요?", "삭제");
        if (!ok) return;
        await deleteDoc(doc(db, "otherGuilds", el.getAttribute("data-id")));
        toast("삭제했어요");
      };
    });

    var addJoinWaitBtn = document.getElementById("addJoinWaitBtn");
    if (addJoinWaitBtn) addJoinWaitBtn.onclick = async function () {
      var nameInput = document.getElementById("joinWaitName");
      var noteInput = document.getElementById("joinWaitNote");
      var name = nameInput.value.trim();
      if (!name) { toast("이름을 입력해주세요"); return; }
      await addDoc(collection(db, "waitlist"), { type: "join", name: name, note: noteInput.value.trim(), createdAt: Date.now() });
      nameInput.value = ""; noteInput.value = "";
      toast("가입 대기자로 등록했어요");
    };
    var addCardWaitBtn = document.getElementById("addCardWaitBtn");
    if (addCardWaitBtn) addCardWaitBtn.onclick = async function () {
      var nameInput = document.getElementById("cardWaitName");
      var noteInput = document.getElementById("cardWaitNote");
      var name = nameInput.value.trim();
      if (!name) { toast("이름을 입력해주세요"); return; }
      await addDoc(collection(db, "waitlist"), { type: "card", name: name, note: noteInput.value.trim(), createdAt: Date.now() });
      nameInput.value = ""; noteInput.value = "";
      toast("카드교환 대기자로 등록했어요");
    };
    Array.prototype.forEach.call(document.querySelectorAll('[data-role="waitlistdelete"]'), function (el) {
      el.onclick = async function () {
        var ok = await confirmDialog("이 대기자를 삭제할까요?", "삭제");
        if (!ok) return;
        await deleteDoc(doc(db, "waitlist", el.getAttribute("data-id")));
        toast("삭제했어요");
      };
    });

    var saveWeeklyMinBtn = document.getElementById("saveWeeklyMinBtn");
    if (saveWeeklyMinBtn) saveWeeklyMinBtn.onclick = async function () {
      var val = Number(document.getElementById("weeklyMinInput").value) || 0;
      await updateDoc(doc(db, "config", "settings"), { guildRankWeeklyMin: val });
      toast("길랭 경고 기준을 저장했어요");
    };

    var changePwBtn = document.getElementById("changePwBtn");
    if (changePwBtn) changePwBtn.onclick = async function () {
      var val = document.getElementById("newPwInput").value;
      if (val.length < 4) { toast("비밀번호는 4자 이상으로 해주세요"); return; }
      await updateDoc(doc(db, "config", "settings"), { adminPassword: val });
      document.getElementById("newPwInput").value = "";
      toast("비밀번호를 변경했어요");
    };
  }

  boot();
</script>
</body>
</html>
